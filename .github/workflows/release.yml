name: Release

on:
  push:
    tags: ["*"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/build.yml

  release:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download build output
        uses: actions/download-artifact@v4
        with:
          name: build-output
          path: build

      - name: Prepare immutable snapshot
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cp build/formula.pdf "formula-technical-${RELEASE_TAG}.pdf"
          cp build/competition.pdf "formula-competition-${RELEASE_TAG}.pdf"
          cd build/_site
          zip -r "../../fsk-rules-web-${RELEASE_TAG}.zip" .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            formula-technical-${{ github.ref_name }}.pdf
            formula-competition-${{ github.ref_name }}.pdf
            fsk-rules-web-${{ github.ref_name }}.zip
          generate_release_notes: true

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy current same-year version
        id: deployment
        uses: actions/deploy-pages@v4
