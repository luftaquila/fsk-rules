name: Release and deploy site

on:
  push:
    tags: ["site-*-v*"]
  workflow_dispatch:
    inputs:
      rollback_tag:
        description: Existing site tag to redeploy after checksum verification
        required: true
        type: string

permissions:
  contents: write
  pages: write
  id-token: write
  attestations: write

concurrency:
  group: production-rules-site
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name == 'push'
    uses: ./.github/workflows/build.yml
    with:
      site_tag: ${{ github.ref_name }}

  prepare:
    runs-on: ubuntu-latest
    needs: [build]
    if: ${{ always() && (github.event_name == 'workflow_dispatch' || needs.build.result == 'success') }}
    outputs:
      release_tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - id: release
        name: Resolve site release
        env:
          ROLLBACK_TAG: ${{ inputs.rollback_tag }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            tag="$ROLLBACK_TAG"
          else
            tag="$GITHUB_REF_NAME"
          fi
          python -c 'from scripts.release_contract import parse_site_tag; import sys; parse_site_tag(sys.argv[1])' "$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Validate release commit and document Releases
        if: github.event_name == 'push'
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          python scripts/release_contract.py check-site --tag "${{ steps.release.outputs.tag }}"

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: github.event_name == 'push'
        with:
          name: build-output
          path: build

      - name: Package new site Release
        if: github.event_name == 'push'
        run: >-
          python scripts/release_contract.py package-site
          --site build/_site
          --output release-assets
          --tag "${{ steps.release.outputs.tag }}"
          --source-commit "$GITHUB_SHA"

      - name: Attest site artifacts
        if: github.event_name == 'push'
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: release-assets/*

      - name: Preserve site assets for the approved deployment
        if: github.event_name == 'push'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: site-release-assets
          path: release-assets/

  deploy:
    runs-on: ubuntu-latest
    needs: prepare
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Download the approved site assets
        if: github.event_name == 'push'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: site-release-assets
          path: release-assets

      - name: Download an existing site Release for rollback
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "${{ needs.prepare.outputs.release_tag }}" --pattern "${{ needs.prepare.outputs.release_tag }}-*" --dir release-assets

      - name: Verify release checksums
        working-directory: release-assets
        run: sha256sum --check "${{ needs.prepare.outputs.release_tag }}-SHA256SUMS"

      - name: Verify site archive provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh attestation verify
          "release-assets/${{ needs.prepare.outputs.release_tag }}-web.zip"
          --repo "$GITHUB_REPOSITORY"

      - name: Extract the verified Pages artifact
        run: >-
          python scripts/release_contract.py extract-site
          --archive "release-assets/${{ needs.prepare.outputs.release_tag }}-web.zip"
          --output pages

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: pages

      - name: Create the approved site Release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${{ needs.prepare.outputs.release_tag }}" release-assets/*
          --verify-tag
          --latest
          --title "FSK Rules ${{ needs.prepare.outputs.release_tag }}"
          --generate-notes

      - name: Deploy approved site Release
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
