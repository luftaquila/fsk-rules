name: Build PDF/HTML

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_call:
    inputs:
      site_tag:
        description: Optional production site tag embedded in the manifest
        required: false
        type: string
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rules-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12.13"

      - name: Install verified build fonts
        run: python scripts/download_build_assets.py

      - name: Compile both rule PDFs
        uses: xu-cheng/latex-action@e2f99d4b3685b0da93f97e1b86ad8fab81105098 # v3
        with:
          docker_image: ghcr.io/xu-cheng/texlive-full:20250301
          root_file: |
            formula.tex
            competition.tex
          latexmk_use_lualatex: true
          extra_fonts: fonts/*

      - name: Install web build dependencies
        run: python -m pip install -r requirements.txt

      - name: Build catalog site and validate contracts
        env:
          SITE_TAG: ${{ inputs.site_tag }}
        run: |
          args=(--skip-pdf --source-commit "$GITHUB_SHA")
          if [[ -n "$SITE_TAG" ]]; then args+=(--site-tag "$SITE_TAG"); fi
          python build.py "${args[@]}"
          python -m unittest discover -s tests

      - name: Validate document revision state
        if: github.ref_type != 'tag'
        run: python scripts/release_contract.py check-catalog

      - name: Render rule key review report
        run: python scripts/rule_key_report.py --output rule-keys-report.md

      - name: Upload rule key review report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rule-keys-report
          path: rule-keys-report.md

      - name: Install browser test dependencies
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Test reader interactions
        run: npm run test:web

      - name: Upload build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: build-output
          path: |
            formula.pdf
            competition.pdf
            _site/
